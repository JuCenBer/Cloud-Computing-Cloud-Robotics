services:
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    extra_hosts:
      - "simupi:host-gateway"
      - "sumupi:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
    - TZ=America/Argentina/Buenos_Aires
    volumes:
    - ./nodered/data:/data
    deploy:
      resources:
        limits:
          memory: 512M
